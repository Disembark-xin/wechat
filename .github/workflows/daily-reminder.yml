name: 微信每日提醒

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅预览，不发送微信消息"
        required: true
        type: boolean
        default: true

  schedule:
    - cron: "45 6 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行测试
        run: python -m unittest discover -s tests -v

      - name: 生成或发送提醒
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          WECHAT_WEATHER_TEMPLATE_ID: ${{ secrets.WECHAT_WEATHER_TEMPLATE_ID }}
          WECHAT_REMINDER_TEMPLATE_ID: ${{ secrets.WECHAT_REMINDER_TEMPLATE_ID }}
          WECHAT_OPEN_ID: ${{ secrets.WECHAT_OPEN_ID }}
          WECHAT_OPEN_ID_2: ${{ secrets.WECHAT_OPEN_ID_2 }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_HOST: ${{ vars.QWEATHER_API_HOST }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python main.py --dry-run
          else
            python main.py
          fi
